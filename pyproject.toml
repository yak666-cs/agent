[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kai-agent"
version = "1.0.0"
description = "Agent Loop Lab - 智能体循环实验项目"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
kai-agent-web = "web_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "tools*", "skills*", "harness*"]
