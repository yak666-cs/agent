name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create .env with API Key
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            cmake libffi-dev libssl-dev python3-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade buildozer cython setuptools

      - name: Inspect environment
        run: |
          echo "=== Python ===" && python3 --version
          echo "=== Java ===" && java -version 2>&1 || true
          echo "=== Buildozer ===" && buildozer --version 2>&1 || true
          echo "=== Env ===" && env | grep -E 'ANDROID|JAVA|SDK|NDK' || true
          echo "=== pip packages ===" && pip list 2>&1 | head -30

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          buildozer android debug --verbose 2>&1 | tee buildozer_output.log

      - name: Print buildozer log on failure
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "=== BUILD FAILED ==="
          [ -f buildozer_output.log ] && tail -100 buildozer_output.log || true
          [ -f buildozer.log ] && echo "=== buildozer.log ===" && tail -100 buildozer.log || true
          echo "=== .buildozer dir ===" && find .buildozer -name "*.log" -exec echo "Found: {}" \; 2>/dev/null | head -10 || true
          exit 1

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kai-agent-apk
          path: bin/*.apk

      - name: Upload logs on failure
        if: steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            buildozer_output.log
            buildozer.log
            .buildozer/**/*.log
